<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Besici - Hayvan Takip</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f5f3;font-family:Arial,sans-serif;color:#222}
header{background:#198754;color:white;padding:20px;text-align:center}
header h1{margin:0 0 5px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
h2{margin-top:0;color:#198754}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,button{width:100%;padding:13px;border-radius:9px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#198754;color:white;font-weight:bold;margin-top:10px}
button.red{background:#dc3545}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#e9f7ef;padding:15px;border-radius:10px;text-align:center}
.stat b{display:block;font-size:25px;color:#198754}
.animal{border-left:5px solid #198754;background:#fafafa;padding:12px;margin-top:10px;border-radius:8px}
.small{color:#666;font-size:14px}
</style>
</head>

<h1>🐄 Besici</h1>
<div>Hayvan Takip ve Yem Maliyeti</div>
</header>
