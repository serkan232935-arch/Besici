name: Deploy website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: GitHub Pages ayarla
        uses: actions/configure-pages@v5

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
