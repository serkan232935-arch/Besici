name: Deploy website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Siteyi paketle
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
